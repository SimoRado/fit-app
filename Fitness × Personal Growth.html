<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fitness × Personal Growth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
:root{
  /* Concept: a night-gym phone app. Bone-white type on near-black, one ember accent.
     Tall condensed numerals carry the hierarchy; the home gauge is a dial of ticks, like a rep counter. */
  color-scheme:dark;
  --stage:#050607; --bg:#08090B; --surface:#13161B; --elev:#1B1F25; --elev2:#262B33;
  --line:#20252C; --line2:#2C323B; --line3:#4A515C;
  --fg:#F5F5F2; --mute:#9298A1; --dim:#69707B;
  --accent:#FF6A2B; --accent-ink:#1B0A02; --accent-soft:rgba(255,106,43,.14); --accent-line:rgba(255,106,43,.42);
  --display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gx:20px; --dx:18px;
}
:root[data-bg="black"]{--bg:#000;--surface:#0B0C0F;--elev:#14171B}
[dir="rtl"]{--dx:-18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;display:flex;align-items:center;justify-content:center;gap:72px;overflow:hidden;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
#root{display:contents}
[dir="rtl"] body,[dir="rtl"] .phone{font-family:'IBM Plex Sans Arabic',var(--body)}
[dir="rtl"] .display,[dir="rtl"] .num{font-family:'IBM Plex Sans Arabic',var(--display);font-weight:700;letter-spacing:0;line-height:1.15}
[dir="rtl"] .label{letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start}
h1,h2,h3,p{margin:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.label{font:600 10.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.display{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:.01em}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:.85}
.accent{color:var(--accent)} .mute{color:var(--mute)} .dim{color:var(--dim)}
.flip{display:block}[dir="rtl"] .flip{transform:scaleX(-1)}

/* side panel (desktop only) */
.side{width:292px;flex:none;display:flex;flex-direction:column;gap:26px}
.side h1{font:900 66px/.86 var(--display);text-transform:uppercase;letter-spacing:.005em}
.side h1 em{font-style:normal;color:var(--accent)}
.side .lede{color:var(--mute);max-width:30ch;font-size:14px}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jump button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);color:var(--mute);font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;transition:.15s}
.jump button:hover{color:var(--fg);border-color:var(--line3)}
.jump button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
@media(max-width:980px){.side{display:none}}

/* phone */
.phone{position:relative;width:390px;max-width:100%;height:100%;max-height:844px;border-radius:48px;background:var(--bg);border:1px solid var(--line2);
  box-shadow:0 0 0 9px #0d0f12,0 0 0 10px #22272e,0 40px 120px rgba(0,0,0,.75);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:80}
.statusbar{flex:none;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 8px;font:600 14px var(--body);letter-spacing:.01em}
.statusbar i{display:flex;gap:5px;align-items:center}
.statusbar b{display:block;width:18px;height:9px;border:1.5px solid var(--fg);border-radius:3px;position:relative}
.statusbar b::after{content:'';position:absolute;inset:1.5px;width:60%;background:var(--fg);border-radius:1px}
@media(max-width:520px){body{padding:0;gap:0}.phone{max-height:none;border-radius:0;border:0;box-shadow:none}.island,.statusbar{display:none}}

.viewport{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;
  padding-block:4px 36px;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px));animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
.screen.tab{animation-name:fadeUp}
.screen::-webkit-scrollbar{display:none}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:54px;border-radius:14px;color:var(--dim);font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;position:relative;transition:color .2s,transform .12s}
[dir="rtl"] .tab{letter-spacing:0;font-family:'IBM Plex Sans Arabic',var(--mono);font-size:11px}
.tab.on{color:var(--fg)} .tab.on svg{color:var(--accent)}
.tab.on::before{content:'';position:absolute;top:-9px;width:24px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.tab:active{transform:scale(.92)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font:800 17px var(--display);letter-spacing:.09em;text-transform:uppercase;transition:transform .12s,filter .2s;text-align:center}
[dir="rtl"] .btn{font-family:'IBM Plex Sans Arabic',var(--display);letter-spacing:0}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--elev);color:var(--fg);border:1px solid var(--line2)}
.btn.block{width:100%} .btn.sm{min-height:42px;padding:0 16px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--elev);border:1px solid var(--line);color:var(--fg);flex:none;transition:transform .12s,background .2s}
.ic:active{transform:scale(.92)} .ic.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{padding:0 15px;min-height:38px;display:inline-flex;align-items:center;border-radius:19px;border:1px solid var(--line2);color:var(--mute);font:600 12.5px var(--body);white-space:nowrap;transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*var(--gx));padding-inline:var(--gx)}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:10px;text-align:center;color:var(--mute);font:700 11px var(--mono);letter-spacing:.1em;transition:.2s}
.seg button.on{background:var(--elev2);color:var(--fg)}

/* common blocks */
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{display:flex;align-items:center;gap:10px}
.mark{font:900 30px/1 var(--display);color:var(--accent)}
.avatar{border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2d333c,#14171c);border:1px solid var(--line3);font:800 17px var(--display);color:var(--fg);flex:none}
.avatar.sm{width:38px;height:38px}
.avatar.lg{width:104px;height:104px;font-size:52px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent);position:relative}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 12px}
.sec h2{font:800 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.sec button{color:var(--accent);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:12px;height:56px;margin-bottom:6px}
.bar-t{font-size:28px;flex:1}
.bar-r{display:flex;gap:8px}
.page-t{font-size:44px;margin:6px 0 4px}
.ok{color:var(--accent)}

/* home */
.hello{margin-top:4px}
.h-title{font-size:34px;line-height:.95}
.h-sub{color:var(--mute);margin-top:8px;max-width:32ch}
.gauge{position:relative;width:100%;max-width:330px;margin:10px auto 0;aspect-ratio:300/200}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tk{stroke:var(--line2);stroke-width:3;stroke-linecap:round;transition:stroke .4s,stroke-width .4s}
.tk.on{stroke:var(--accent)} .tk.tip{stroke:#FFB38F;stroke-width:4;filter:drop-shadow(0 0 5px var(--accent))}
.gauge-c{position:absolute;left:0;right:0;bottom:9%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gauge-c .num{font-size:118px;font-weight:900;display:flex;align-items:flex-start;gap:2px}
.gauge-c .num sup{font-size:34px;margin-top:10px;color:var(--accent);font-weight:800}
.streak{display:flex;align-items:center;gap:16px;margin-top:20px;padding:14px 0;border-block:1px solid var(--line)}
.streak .big{font-size:58px;font-weight:900}
.streak .s-sub{display:block;color:var(--mute);font-size:12.5px;margin-top:5px}
.ribbon{flex:1;display:flex;align-items:flex-end;gap:4px;height:38px;min-width:0}
.ribbon i{flex:1;border-radius:2px;background:var(--line2)}
.ribbon i.on{background:var(--accent)} .ribbon i.today{animation:breathe 2.2s infinite}
.feature{position:relative;border-radius:28px;overflow:hidden;min-height:268px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px;background:var(--surface);isolation:isolate;cursor:pointer;border:1px solid var(--line2);transition:transform .15s}
.feature:active{transform:scale(.99)}
.feature::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(8,9,11,.96) 14%,rgba(8,9,11,.35) 62%,rgba(8,9,11,.05))}
.feature .f-title{font-size:46px;max-width:11ch}
.feature .f-meta{color:var(--mute);font-size:12.5px}
.feature .f-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;background:rgba(8,9,11,.6);border:1px solid var(--line3);font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(6px)}
.tag.acc{border-color:var(--accent-line);color:var(--accent)}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.grain::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);color:inherit;transition:opacity .2s}
.row:active{opacity:.7}
.row .rt{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{color:var(--mute);font-size:12.5px;margin-top:2px}
.row.done .t{color:var(--mute)}
.stamp{font:600 10px var(--mono);letter-spacing:.14em;color:var(--accent);border:1px solid var(--accent-line);padding:5px 8px;border-radius:6px}
.quick{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring-c{position:relative;display:grid;place-items:center;color:var(--mute)}

.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px}
.hb{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.hb span{font:600 11px var(--body);color:var(--mute)}
.hb.done span{color:var(--fg)}
.hb .ring{width:72px;height:72px}
.hb .fill{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--elev);color:var(--mute);border:1px solid var(--line2);transition:.25s;position:relative;z-index:1}
.hb.done .fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);animation:pop .4s}
.hb.done .fill svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .05s forwards}
.hb:active .fill{transform:scale(.92)}

.wcard{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%;padding:18px 0 4px;color:inherit}
.wnum{font-size:78px;font-weight:900;display:flex;align-items:baseline;gap:6px}
.wnum small{font:600 14px var(--mono);color:var(--mute);letter-spacing:.1em}
.delta{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;color:var(--accent)}
.wmeta{display:flex;gap:22px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wmeta div{flex:1}
.wmeta b{display:block;font:800 26px/1 var(--display);margin-top:6px}

.quote{position:relative;display:block;width:100%;aspect-ratio:16/11;border-radius:26px;overflow:hidden;isolation:isolate;border:1px solid var(--line2);container-type:inline-size}
.quote::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(8,9,11,.95) 6%,rgba(8,9,11,.3) 70%)}
.quote .in{position:absolute;inset:0;padding:6cqw;display:flex;flex-direction:column;justify-content:space-between}
.quote .q-t{font-size:8.4cqw;line-height:.96}

/* habits */
.hsum{display:flex;align-items:flex-end;gap:18px;margin:8px 0 18px}
.hsum .num{font-size:84px;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 8px;border-radius:16px;border:1px solid transparent}
.wd.sel{background:var(--surface);border-color:var(--line2)}
.wd .label{font-size:9.5px}
.wd .dn{font:800 15px/1 var(--display);color:var(--mute)}
.wd.tdy .dn{color:var(--accent)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.hrow .t{font-weight:600;font-size:15px}
.hrow .s{color:var(--mute);font-size:12px;margin-top:2px}
.hrow.past{opacity:.75}
.cstrip{display:flex;gap:3px;align-items:flex-end;height:22px;margin-top:7px}
.cstrip i{width:6px;height:100%;border-radius:2px;background:var(--line2)} .cstrip i.on{background:var(--accent)} .cstrip i.last{outline:1px solid var(--line3);outline-offset:1px}
.rt2{text-align:end;flex:none}
.chk{border:1.5px solid var(--line3);border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);transition:background .2s,border-color .2s,transform .12s;flex:none}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--accent);border-color:var(--accent);animation:pop .4s}
.chk.on svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .05s forwards}

/* workouts */
.freq{display:flex;align-items:flex-end;gap:18px;margin:6px 0 4px}
.freq .num{font-size:96px;font-weight:900}
.fdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 22px}
.fd{display:flex;flex-direction:column;align-items:center;gap:7px}
.fd i{width:100%;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.fd i.on{background:var(--accent);border-color:var(--accent)} .fd i.t{border-color:var(--accent-line)}
.fd .label{font-size:9px}
.routine{display:flex;align-items:center;gap:14px;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.routine .rn{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.hist{display:flex;gap:14px;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line)}
.hist .hd{width:48px;text-align:center;flex:none}
.hist .hd b{display:block;font:900 26px/1 var(--display)}
.hmetrics{display:flex;gap:14px;margin-top:6px;color:var(--mute);font:500 12px var(--mono)}
.pr{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font:600 10px var(--mono);letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.astats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.astats div{background:var(--surface);padding:12px 14px}
.astats b{display:block;font:800 28px/1 var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.timer{font:800 30px/1 var(--display);letter-spacing:.04em;flex:1;text-align:center;font-variant-numeric:tabular-nums}
.exb{margin-bottom:22px}
.exh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.exh h3{font-size:28px}
.setrow{display:grid;grid-template-columns:30px 1fr 74px 74px 38px;gap:8px;align-items:center;margin-bottom:8px}
.setrow.head{margin-bottom:6px} .setrow.head span{text-align:center}
.setrow .sn{font:800 18px var(--display);color:var(--mute);text-align:center}
.setrow .prev{font:500 12px var(--mono);color:var(--dim);text-align:center}
.cell{width:100%;height:44px;border-radius:12px;text-align:center;background:var(--elev);border:1px solid transparent;color:var(--fg);font:800 22px var(--display);font-variant-numeric:tabular-nums}
.setrow.done .cell{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.addset{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;border-radius:12px;border:1px dashed var(--line3);color:var(--mute);font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.dock{position:sticky;bottom:-36px;margin-inline:calc(-1*var(--gx));padding:16px var(--gx) 20px;background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:10px;z-index:5}

/* weight */
.wbig{display:flex;align-items:baseline;gap:8px}
.wbig .num{font-size:112px;font-weight:900}
.wbig .unit{font:600 14px var(--mono);color:var(--mute);letter-spacing:.1em}
.chartbox{position:relative;touch-action:pan-y;margin:16px 0 4px;cursor:crosshair}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.lnpath{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.area{animation:fade .9s .3s both}
.readout{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.readout b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.goal{margin:24px 0 8px}
.gbar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin-top:18px}
.trio div{background:var(--surface);padding:14px}
.trio b{display:block;font:800 30px/1 var(--display);margin-top:8px}

function useCount(v,start){

}

/* ---------- weight chart ---------- */
function smooth(pts){
 if(pts.length<3)return 'M'+pts.map(q=>q.join(',')).join('L');
 let d=`M${pts[0][0]},${pts[0][1]}`;
 for(let i=0;i<pts.length-1;i++){
  const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,k=.17;
  d+=`C${p1[0]+(p2[0]-p0[0])*k},${p1[1]+(p2[1]-p0[1])*k} ${p2[0]-(p3[0]-p1[0])*k},${p2[1]-(p3[1]-p1[1])*k} ${p2[0]},${p2[1]}`;
 }
 return d;
}
function WeightChart({data}){

 const lo=Math.floor((Math.min(...kgs)-.2)*2)/2,hi=Math.ceil((Math.max(...kgs)+.2)*2)/2;
 const step=(hi-lo)>3?1:.5;
 const X=i=>pl+i*(W-pl-pr)/(n-1),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
 const pts=data.map((x,i)=>[X(i),Y(x.kg)]);
 const dLine=smooth(pts);
 const dArea=dLine+`L${X(n-1)},${H-pb}L${X(0)},${H-pb}Z`;
 const idx=hov===null?n-1:hov;
 const ticks=[];for(let v=Math.ceil(lo/step)*step;v<=hi+.001;v+=step)ticks.push(v);
 const move=e=>{const r=ref.current.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*W;setHov(clamp(Math.round((sx-pl)/(W-pl-pr)*(n-1)),0,n-1))};
 const dx=data[idx];
 return div(null,
  div({className:'readout'},
   div(null,span({className:'label'},fmt(dx.d)),div({style:{marginTop:6}},h('b',null,f1(dx.kg)+' kg'))),
   span({className:'delta'},(idx>0?(dx.kg-data[idx-1].kg>0?'+':'')+f1(dx.kg-data[idx-1].kg)+' kg vs prev':'First entry'))),
  div({className:'chartbox',ref,onPointerMove:move,onPointerDown:move,onPointerLeave:()=>setHov(null)},

    defs(linearGradient({id:'wa',x1:0,y1:0,x2:0,y2:1},stop({offset:0,stopColor:'#FF6A2B',stopOpacity:.32}),stop({offset:1,stopColor:'#FF6A2B',stopOpacity:0}))),
    ticks.map(v=>g({key:v},
     line({x1:pl,x2:W-pr,y1:Y(v),y2:Y(v),stroke:'var(--line)',strokeWidth:1}),
     h('text',{x:W-pr,y:Y(v)-5,textAnchor:'end',fill:'var(--dim)',style:{font:'500 9px var(--mono)'}},f1(v)))),
    path({key:'a'+n,className:'area',d:dArea,fill:'url(#wa)'}),
    path({key:'l'+n,className:'lnpath',d:dLine,pathLength:1,fill:'none',stroke:'var(--accent)',strokeWidth:3,strokeLinecap:'round',strokeLinejoin:'round'}),
    line({x1:X(idx),x2:X(idx),y1:pt-6,y2:H-pb,stroke:'var(--line3)',strokeDasharray:'3 4'}),
    circle({cx:X(idx),cy:Y(dx.kg),r:9,fill:'var(--accent)',opacity:.2}),
    circle({cx:X(idx),cy:Y(dx.kg),r:4.5,fill:'var(--accent)',stroke:'var(--bg)',strokeWidth:2}),
    [0,Math.floor((n-1)/2),n-1].map((i,k)=>h('text',{key:k,x:X(i),y:H-6,textAnchor:k===0?'start':k===2?'end':'middle',fill:'var(--dim)',style:{font:'500 9px var(--mono)'}},data[i].d.getDate()+' '+MO[data[i].d.getMonth()])))));
